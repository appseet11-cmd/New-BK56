<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOC Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #1e3a8a; color: white; min-height: 100vh; display: flex; flex-direction: column; }
.header { background: rgba(0,0,0,0.4); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); }
.header h1 { font-size: 1rem; display: flex; align-items: center; gap: 8px; }
.btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s; }
.btn:hover { background: rgba(255,255,255,0.25); }
.btn-primary { background: #2563eb; border-color: #2563eb; }
.viewer { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; }
.viewer iframe { width: 100%; height: calc(100vh - 70px); border: none; border-radius: 8px; background: white; }
.loading { text-align: center; padding: 40px; }
.loading .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #2563eb; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { text-align: center; padding: 40px; color: #ef4444; }
</style>
</head>
<body>
<div class="header">
  <h1>📄 DOC Viewer</h1>
  <div style="display:flex; gap:8px;">
    <a href="#" class="btn btn-primary" id="btnDrive" target="_blank">🔗 Drive</a>
    <button class="btn" onclick="location.reload()">🔄</button>
    <button class="btn" onclick="window.close()">✕</button>
  </div>
</div>
<div class="viewer" id="viewer">
  <div class="loading"><div class="spinner"></div><p>Memuat dokumen...</p></div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const fileId = params.get('fileId');
const title = params.get('title') || 'DOC Viewer';
document.title = title;
if (fileId) {
  document.getElementById('btnDrive').href = 'https://drive.google.com/file/d/' + fileId + '/view';
  const viewer = document.getElementById('viewer');
  viewer.innerHTML = '<iframe src="https://docs.google.com/document/d/' + fileId + '/preview" allowfullscreen></iframe>';
} else {
  document.getElementById('viewer').innerHTML = '<div class="error">❌ Tidak ada fileId di URL</div>';
}
</script>
</body>
</html>
