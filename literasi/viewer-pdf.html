<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDF Viewer</title>
<style>
  body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; background: #f3f4f6; }
  header { background: #dc2626; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  h1 { margin: 0; font-size: 16px; }
  .btn-back { background: #1f2937; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
  .btn-back:hover { background: #111827; }
  #viewer-container { flex: 1; width: 100%; }
  iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<header>
  <h1>📕 PDF Viewer</h1>
  <button class="btn-back" onclick="window.close()">✕ Kembali / Tutup</button>
</header>
<div id="viewer-container"></div>
<script>
  const fileId = new URLSearchParams(window.location.search).get('fileId');
  if (fileId) {
    document.getElementById('viewer-container').innerHTML = '<iframe src="https://drive.google.com/file/d/' + fileId + '/preview" allowfullscreen></iframe>';
  } else {
    document.getElementById('viewer-container').innerHTML = '<div style="text-align:center; padding:50px; color:red;">File ID tidak ditemukan.</div>';
  }
</script>
</body>
</html>
