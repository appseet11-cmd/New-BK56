<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Video Player</title>
<style>body{margin:0;background:#064e3b;color:white;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}header{padding:12px;background:#022c22;display:flex;justify-content:space-between;align-items:center}h1{font-size:16px;margin:0}.btn{background:#059669;color:white;border:none;padding:6px 12px;border-radius:4px;text-decoration:none;font-size:12px}#container{flex:1;display:flex;justify-content:center;align-items:center;background:black}iframe{width:100%;height:100%;border:none}.error{text-align:center;padding:20px;color:#ff6b6b}</style>
</head><body>
<header><h1>🎬 Video Player</h1><a href="#" id="driveLink" class="btn" target="_blank">Buka di Drive</a></header>
<div id="container"><div class="error">Memuat...</div></div>
<script>
const fileId = new URLSearchParams(window.location.search).get('fileId');
if (fileId) {
  document.getElementById('driveLink').href = 'https://drive.google.com/file/d/' + fileId + '/view';
  document.getElementById('container').innerHTML = '<iframe src="https://drive.google.com/file/d/' + fileId + '/preview" allowfullscreen allow="autoplay"></iframe>';
} else {
  document.getElementById('container').innerHTML = '<div class="error">❌ File ID tidak ditemukan</div>';
}
</script></body></html>
