<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Video Player</title>
<style>
  body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; background: #000; }
  header { background: #111827; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
  h1 { margin: 0; font-size: 16px; color: #10b981; }
  .btn-back { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
  .btn-back:hover { background: #dc2626; }
  #viewer-container { flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; }
  iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<header>
  <h1>🎬 Video Player</h1>
  <button class="btn-back" onclick="window.close()">✕ Kembali / Tutup</button>
</header>
<div id="viewer-container"></div>
<script>
  const fileId = new URLSearchParams(window.location.search).get('fileId');
  if (fileId) {
    document.getElementById('viewer-container').innerHTML = '<iframe src="https://drive.google.com/file/d/' + fileId + '/preview" allowfullscreen allow="autoplay"></iframe>';
  } else {
    document.getElementById('viewer-container').innerHTML = '<div style="color:red;">File ID tidak ditemukan.</div>';
  }
</script>
</body>
</html>
