<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player Universal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Poppins', sans-serif;
    background: #000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: white;
}
.player-header {
    background: linear-gradient(135deg, #059669 0%, #065F46 100%);
    color: white;
    padding: 12px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
    flex-wrap: wrap;
    gap: 10px;
    z-index: 100;
}
.player-header .title-section { display: flex; align-items: center; gap: 12px; }
.player-header .icon { font-size: 1.8rem; }
.player-header h1 { font-size: 1.1rem; font-weight: 600; }
.player-header .file-info { font-size: 0.75rem; opacity: 0.9; }
.player-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ctrl-btn {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.3s ease;
}
.ctrl-btn:hover { background: rgba(255,255,255,0.35); transform: translateY(-2px); }
.ctrl-btn.primary { background: rgba(255,255,255,0.95); color: #065F46; font-weight: 600; }
.ctrl-btn.primary:hover { background: white; }
.ctrl-btn.fullscreen-btn { background: #059669; border-color: #059669; }
.ctrl-btn.fullscreen-btn:hover { background: #047857; }
.ctrl-btn.normal-btn { background: #D97706; border-color: #D97706; }
.ctrl-btn.normal-btn:hover { background: #B45309; }

.player-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    position: relative;
    transition: all 0.3s ease;
}
.player-container.fullscreen-mode { padding: 0; background: #000; }

.video-wrapper {
    width: 100%;
    max-width: 1200px;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    position: relative;
    transition: all 0.3s ease;
}
.player-container.fullscreen-mode .video-wrapper {
    max-width: 100%;
    width: 100vw;
    height: 100vh;
    aspect-ratio: auto;
    border-radius: 0;
    box-shadow: none;
}

/* IFRAME untuk video embed */
.video-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #000;
}

/* HTML5 video (fallback) */
.video-wrapper video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

/* Loading & Error */
.loading-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    transition: opacity 0.5s ease;
}
.loading-overlay.hidden { opacity: 0; pointer-events: none; }
.loading-spinner {
    width: 50px; height: 50px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: #10B981;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 15px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: #10B981; font-weight: 500; font-size: 0.95rem; }

.error-state { text-align: center; padding: 40px; color: white; }
.error-state .icon { font-size: 4rem; margin-bottom: 15px; }
.error-state h2 { margin-bottom: 10px; }
.error-state p { opacity: 0.8; margin-bottom: 20px; }
.error-state .btn-retry {
    background: #059669;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
}

/* Floating controls saat fullscreen */
.floating-controls {
    position: fixed;
    top: 20px;
    right: 20px;
    display: none;
    gap: 10px;
    z-index: 1000;
}
.floating-controls.show { display: flex; }
.floating-btn {
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.3);
    color: white;
    padding: 12px 20px;
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}
.floating-btn:hover { transform: translateY(-3px); }
.floating-btn.fullscreen { background: rgba(5, 150, 105, 0.9); border-color: #059669; }
.floating-btn.normal { background: rgba(217, 119, 6, 0.9); border-color: #D97706; }
.floating-btn.back { background: rgba(99, 102, 241, 0.9); border-color: #6366F1; }

@media (max-width: 768px) {
    .player-header { padding: 10px 15px; }
    .player-header h1 { font-size: 0.95rem; }
    .ctrl-btn { padding: 6px 10px; font-size: 0.72rem; }
    .player-container { padding: 10px; }
    .video-wrapper { border-radius: 12px; }
    .floating-btn { padding: 10px 16px; font-size: 0.78rem; }
}
</style>
</head>
<body>
<div class="player-header" id="playerHeader">
    <div class="title-section">
        <span class="icon">🎬</span>
        <div>
            <h1 id="playerTitle">Video Player</h1>
            <div class="file-info" id="fileInfo">Memuat video...</div>
        </div>
    </div>
    <div class="player-controls">
        <button class="ctrl-btn fullscreen-btn" id="btnFullscreen" onclick="enterFullscreen()" title="Mode Fullscreen">
            ⛶ Fullscreen
        </button>
        <button class="ctrl-btn normal-btn" id="btnNormal" onclick="exitFullscreen()" title="Kembali Normal" style="display:none;">
            ⊡ Normal
        </button>
        <button class="ctrl-btn" onclick="openOriginal()" title="Buka di Google Drive">🔗 Drive</button>
        <button class="ctrl-btn primary" onclick="goBack()" title="Kembali">← Kembali</button>
    </div>
</div>

<div class="player-container" id="playerContainer">
    <div class="video-wrapper" id="videoWrapper">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">Memuat video...</div>
        </div>
        
        <!-- Video akan di-load di sini -->
    </div>
</div>

<!-- Floating controls saat fullscreen -->
<div class="floating-controls" id="floatingControls">
    <button class="floating-btn normal" onclick="exitFullscreen()">
        ⊡ Kembali Normal
    </button>
    <button class="floating-btn back" onclick="goBack()">
        ← Kembali
    </button>
</div>

<script>
// ============================================================
// VIDEO PLAYER UNIVERSAL - PERBAIKAN
// ============================================================
const params = new URLSearchParams(window.location.search);
const fileId = params.get('fileId') || '';
const title = params.get('title') || 'Video Player';

document.getElementById('playerTitle').textContent = title;
document.getElementById('fileInfo').textContent = fileId ? `File ID: ${fileId.substring(0, 15)}...` : 'Tidak ada video';

const videoWrapper = document.getElementById('videoWrapper');
const loadingOverlay = document.getElementById('loadingOverlay');
const playerContainer = document.getElementById('playerContainer');
const floatingControls = document.getElementById('floatingControls');
const btnFullscreen = document.getElementById('btnFullscreen');
const btnNormal = document.getElementById('btnNormal');
const playerHeader = document.getElementById('playerHeader');

let isFullscreen = false;
let useIframeMode = true; // Default pakai iframe (lebih reliable)

// ============================================================
// LOAD VIDEO - PERBAIKAN
// ============================================================
function loadVideo() {
    if (!fileId) {
        loadingOverlay.innerHTML = `
            <div class="error-state">
                <div class="icon">⚠️</div>
                <h2>File ID Tidak Ditemukan</h2>
                <p>Parameter fileId tidak ada di URL</p>
                <button class="btn-retry" onclick="goBack()">← Kembali</button>
            </div>
        `;
        return;
    }
    
    console.log('🎬 Loading video with fileId:', fileId);
    
    // PERBAIKAN: Gunakan iframe embed (paling reliable untuk Google Drive)
    // URL preview Google Drive akan menampilkan video player native
    const embedUrl = `https://drive.google.com/file/d/${fileId}/preview`;
    
    const iframe = document.createElement('iframe');
    iframe.src = embedUrl;
    iframe.allow = 'autoplay; encrypted-media; fullscreen';
    iframe.allowFullscreen = true;
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    iframe.style.border = 'none';
    iframe.style.background = '#000';
    
    iframe.onload = function() {
        console.log('✅ Video iframe loaded');
        loadingOverlay.classList.add('hidden');
    };
    
    iframe.onerror = function() {
        console.error('❌ Iframe error, trying fallback...');
        loadVideoFallback();
    };
    
    videoWrapper.appendChild(iframe);
    
    // Timeout fallback - jika iframe tidak load dalam 8 detik
    setTimeout(() => {
        if (!loadingOverlay.classList.contains('hidden')) {
            console.log('⚠️ Timeout, trying fallback...');
            loadVideoFallback();
        }
    }, 8000);
}

// Fallback: Coba dengan HTML5 video tag
function loadVideoFallback() {
    console.log('🔄 Trying HTML5 video fallback...');
    
    // Hapus iframe jika ada
    const existingIframe = videoWrapper.querySelector('iframe');
    if (existingIframe) existingIframe.remove();
    
    // Coba beberapa URL streaming
    const videoUrls = [
        `https://drive.google.com/uc?export=download&id=${fileId}`,
        `https://docs.google.com/uc?id=${fileId}&export=download`,
        `https://drive.google.com/file/d/${fileId}/view?usp=sharing`
    ];
    
    const video = document.createElement('video');
    video.controls = true;
    video.controlsList = 'nodownload';
    video.preload = 'metadata';
    video.playsInline = true;
    video.style.width = '100%';
    video.style.height = '100%';
    video.style.background = '#000';
    
    // Coba URL pertama
    const source = document.createElement('source');
    source.src = videoUrls[0];
    source.type = 'video/mp4';
    video.appendChild(source);
    
    video.addEventListener('loadeddata', function() {
        console.log('✅ Video loaded via HTML5');
        loadingOverlay.classList.add('hidden');
    }, { once: true });
    
    video.addEventListener('error', function(e) {
        console.error('❌ HTML5 video error:', e);
        // Tampilkan pesan error dengan link ke Drive
        loadingOverlay.innerHTML = `
            <div class="error-state">
                <div class="icon">🎬</div>
                <h2>Video Tidak Dapat Diputar Langsung</h2>
                <p>Google Drive memblokir streaming langsung.<br>Silakan buka video di Google Drive.</p>
                <button class="btn-retry" onclick="openOriginal()">🔗 Buka di Google Drive</button>
                <button class="btn-retry" onclick="goBack()" style="margin-left:10px;">← Kembali</button>
            </div>
        `;
    }, { once: true });
    
    videoWrapper.appendChild(video);
    video.load();
}

// ============================================================
// FULLSCREEN MODE
// ============================================================
function enterFullscreen() {
    isFullscreen = true;
    playerContainer.classList.add('fullscreen-mode');
    floatingControls.classList.add('show');
    playerHeader.style.display = 'none';
    btnFullscreen.style.display = 'none';
    btnNormal.style.display = 'flex';
    
    // Try native fullscreen
    if (videoWrapper.requestFullscreen) {
        videoWrapper.requestFullscreen().catch(err => {
            console.log('Native fullscreen not available:', err);
        });
    }
}

function exitFullscreen() {
    isFullscreen = false;
    playerContainer.classList.remove('fullscreen-mode');
    floatingControls.classList.remove('show');
    playerHeader.style.display = 'flex';
    btnFullscreen.style.display = 'flex';
    btnNormal.style.display = 'none';
    
    if (document.exitFullscreen) {
        document.exitFullscreen().catch(err => {});
    }
}

// Listen fullscreen change
document.addEventListener('fullscreenchange', function() {
    if (!document.fullscreenElement && isFullscreen) {
        exitFullscreen();
    }
});

// ============================================================
// NAVIGATION
// ============================================================
function openOriginal() {
    if (!fileId) return;
    window.open(`https://drive.google.com/file/d/${fileId}/view`, '_blank');
}

function goBack() {
    if (isFullscreen) exitFullscreen();
    if (document.referrer && document.referrer !== window.location.href) {
        window.history.back();
    } else {
        window.close();
    }
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
    if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        isFullscreen ? exitFullscreen() : enterFullscreen();
    }
    if (e.key === 'Escape' && isFullscreen) {
        exitFullscreen();
    }
});

// Double click to fullscreen
videoWrapper.addEventListener('dblclick', function(e) {
    if (e.target.tagName === 'IFRAME') return; // Jangan trigger di iframe
    isFullscreen ? exitFullscreen() : enterFullscreen();
});

// Load video
window.addEventListener('DOMContentLoaded', loadVideo);
</script>
</body>
</html>
