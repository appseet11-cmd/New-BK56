<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PPT Viewer</title>
<style>
body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
header { background: #d97706; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
h1 { margin: 0; font-size: 16px; }
.btn { background: white; color: #d97706; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: 5px; }
#viewer { flex: 1; }
iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<header>
  <h1>📊 PPT Viewer</h1>
  <div>
    <button class="btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
    <button class="btn" onclick="window.close()">✕ Tutup</button>
  </div>
</header>
<div id="viewer"></div>
<script>
const fileId = new URLSearchParams(window.location.search).get('fileId');
if (fileId) {
  document.getElementById('viewer').innerHTML = '<iframe src="https://docs.google.com/presentation/d/' + fileId + '/embed?start=false&loop=false&delayms=3000" allowfullscreen></iframe>';
} else {
  document.getElementById('viewer').innerHTML = '<div style="text-align:center; padding:50px; color:red;">❌ File ID tidak ditemukan</div>';
}
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}
</script>
</body>
</html>
