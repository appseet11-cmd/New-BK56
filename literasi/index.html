<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Literasi Digital & Riset Mandiri | Materi BK Kelas IX</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root { --primary: #1E40AF; --belajar: #10B981; --belajar-dark: #065F46; --pribadi: #6366F1; --dark: #1F2937; --gray: #6B7280; --light: #F9FAFB; --white: #FFFFFF; --shadow: 0 10px 30px rgba(0,0,0,0.08); --ppt: #D97706; --doc: #2563EB; --pdf: #DC2626; --mp4: #059669; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #F3F4F6 0%, #D1FAE5 100%); color: var(--dark); line-height: 1.7; min-height: 100vh; }
.hero { background: linear-gradient(135deg, var(--belajar) 0%, var(--primary) 50%, #7C3AED 100%); color: var(--white); padding: 70px 20px 100px; text-align: center; }
.hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 800; margin-bottom: 15px; }
.container { max-width: 1200px; margin: 0 auto; padding: 60px 20px; }
.overview, .file-section { background: var(--white); border-radius: 24px; padding: 40px; box-shadow: var(--shadow); margin-bottom: 30px; }
.file-tabs { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; background: var(--light); padding: 10px; border-radius: 14px; }
.file-tab { padding: 12px 22px; border-radius: 10px; cursor: pointer; font-weight: 600; background: var(--white); color: var(--gray); flex: 1; text-align: center; transition: all 0.3s; }
.file-tab.active[data-type="ppt"] { background: var(--ppt); color: var(--white); }
.file-tab.active[data-type="doc"] { background: var(--doc); color: var(--white); }
.file-tab.active[data-type="pdf"] { background: var(--pdf); color: var(--white); }
.file-tab.active[data-type="mp4"] { background: var(--mp4); color: var(--white); }
.file-panel { display: none; } .file-panel.show { display: block; }
.input-slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 25px; }
.input-slot { background: var(--light); padding: 18px; border-radius: 14px; border: 2px dashed #D1D5DB; position: relative; transition: all 0.3s; }
.input-slot.filled { border-style: solid; border-color: var(--belajar); background: #D1FAE5; }
.input-slot.saving { border-color: var(--ppt); }
.input-slot input { width: 100%; padding: 11px 14px; border: 1.5px solid #D1D5DB; border-radius: 10px; margin-bottom: 10px; font-family: 'Poppins'; }
.slot-actions { display: flex; gap: 8px; }
.btn-embed, .btn-clear, .btn-open-viewer { flex: 1; padding: 10px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; color: white; font-family: 'Poppins'; transition: all 0.3s; }
.btn-embed { background: var(--belajar); } .btn-embed:hover { background: var(--belajar-dark); }
.btn-clear { background: var(--pdf); } .btn-clear:hover { opacity: 0.8; }
.btn-open-viewer { background: var(--pribadi); } .btn-open-viewer:hover { opacity: 0.8; }
.embedded-files { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
.embedded-item { background: var(--white); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); border: 2px solid #D1FAE5; }
.embedded-item-header { padding: 12px 16px; background: #D1FAE5; display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: var(--belajar-dark); }
.toast { position: fixed; bottom: 30px; right: 30px; background: var(--dark); color: white; padding: 14px 22px; border-radius: 12px; z-index: 1000; transform: translateY(100px); opacity: 0; transition: all 0.4s; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: #059669; } .toast.error { background: #DC2626; } .toast.warning { background: #D97706; }
.sync-status-bar { display: flex; justify-content: space-between; align-items: center; background: #E0E7FF; padding: 12px 18px; border-radius: 12px; margin-bottom: 20px; }
.btn-sync { background: var(--pribadi); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Poppins'; }
.btn-sync:disabled { opacity: 0.6; }
</style>
</head>
<body>

<header class="hero">
  <h1>Literasi Digital & Riset Mandiri</h1>
  <p>Materi BK Kelas IX - SMPN 56 Jakarta</p>
</header>

<main class="container">
  <section class="overview">
    <h2>🔍 Tentang Topik Ini</h2>
    <p>Menguasai keterampilan mencari, mengevaluasi, dan mensintesis informasi dari berbagai sumber digital.</p>
  </section>

  <section class="file-section">
    <h2>📂 Materi & File Pendukung</h2>
    <div class="sync-status-bar">
      <span id="syncText">Memeriksa koneksi...</span>
      <button class="btn-sync" id="btnSync" onclick="syncFromServer()">🔄 Sync dari Server</button>
    </div>
    <div class="file-tabs">
      <div class="file-tab active" data-type="ppt" onclick="switchTab('ppt', this)">📊 PPT</div>
      <div class="file-tab" data-type="doc" onclick="switchTab('doc', this)">📄 Doc</div>
      <div class="file-tab" data-type="pdf" onclick="switchTab('pdf', this)">📕 PDF</div>
      <div class="file-tab" data-type="mp4" onclick="switchTab('mp4', this)">🎬 Video MP4</div>
    </div>
    <div class="file-panel show" id="panel-ppt"><div class="input-slots" id="inputs-ppt"></div><div class="embedded-files" id="embed-ppt"></div></div>
    <div class="file-panel" id="panel-doc"><div class="input-slots" id="inputs-doc"></div><div class="embedded-files" id="embed-doc"></div></div>
    <div class="file-panel" id="panel-pdf"><div class="input-slots" id="inputs-pdf"></div><div class="embedded-files" id="embed-pdf"></div></div>
    <div class="file-panel" id="panel-mp4"><div class="input-slots" id="inputs-mp4"></div><div class="embedded-files" id="embed-mp4"></div></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
// ============================================================
// 🔧 KONFIGURASI UTAMA (Gunakan 1 URL ini untuk Save & Sync)
// ============================================================
// PASTIKAN URL INI SAMA DENGAN URL DEPLOYMENT ANDA YANG AKTIF
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyqIp4C8weFTtOn22YnNP_o4Yq27ffHerJPfHud2FCZJ_Xwx-y35nXvPucSALiE3is7fQ/exec'; 
const PAGE_ID = 'kelas9_topik5_literasi_digital';
const PAGE_TITLE = 'Literasi Digital & Riset Mandiri - Kelas IX';

const types = ['ppt', 'doc', 'pdf', 'mp4'];
const typeLabels = { ppt: 'PPT', doc: 'DOC', pdf: 'PDF', mp4: 'MP4' };
const typePlaceholders = { ppt: 'PPT (PowerPoint)', doc: 'Doc (Word)', pdf: 'PDF', mp4: 'Video MP4' };
const typeIcons = { ppt: '📊', doc: '📄', pdf: '📕', mp4: '🎬' };
const VIEWER_BASE_URL = window.location.origin + window.location.pathname.replace(/[^/]*$/, '');
const VIEWER_URLS = {
  ppt: VIEWER_BASE_URL + 'viewer-ppt.html',
  doc: VIEWER_BASE_URL + 'viewer-doc.html',
  pdf: VIEWER_BASE_URL + 'viewer-pdf.html',
  mp4: VIEWER_BASE_URL + 'viewer-video.html'
};

// ============================================================
// 1. GENERATE SLOT INPUT (Dijalankan 1x saat load)
// ============================================================
types.forEach(type => {
  const container = document.getElementById(`inputs-${type}`);
  if (!container) return;
  let html = '';
  for (let i = 1; i <= 4; i++) {
    html += `<div class="input-slot" id="slot-${type}-${i}">
      <div class="slot-label"><span>${typeIcons[type]} Slot ${i}</span><span class="slot-badge">${typeLabels[type]}</span></div>
      <input type="text" id="input-${type}-${i}" placeholder="Tempel link Google Drive ${typePlaceholders[type]}..." onkeypress="if(event.key==='Enter') embedFile('${type}', ${i})">
      <div class="slot-actions">
        <button class="btn-embed" onclick="embedFile('${type}', ${i})">📥 Sematkan</button>
        <button class="btn-open-viewer" onclick="openViewer('${type}', ${i})">👁 Viewer</button>
        <button class="btn-clear" onclick="clearFile('${type}', ${i})">🗑 Hapus</button>
      </div>
    </div>`;
  }
  container.innerHTML = html;
  
  // Siapkan state kosong untuk embedded items
  const embedContainer = document.getElementById(`embed-${type}`);
  if (embedContainer && embedContainer.children.length === 0) {
    embedContainer.innerHTML = `<div class="empty-state"><div class="icon">${typeIcons[type]}</div><p><strong>Belum ada file ${typeLabels[type]}</strong></p></div>`;
  }
});

// ============================================================
// 2. FUNGSI AUTO-SYNC (Menarik data dari Spreadsheet)
// ============================================================
async function syncFromServer() {
  const syncText = document.getElementById('syncText');
  const syncDot = document.getElementById('syncDot');
  if(syncText) syncText.textContent = 'Sedang sinkronisasi otomatis...';
  if(syncDot) syncDot.className = 'sync-dot syncing';

  try {
    // Tarik data dari backend (doGet)
    const response = await fetch(`${BACKEND_URL}?action=getAllFiles&pageId=${PAGE_ID}`);
    const result = await response.json();

    if (result.success && result.files) {
      loadFilesToUI(result.files);
      if(syncText) syncText.textContent = `✓ Tersinkron otomatis (${result.files.length} file)`;
      if(syncDot) syncDot.className = 'sync-dot online';
    }
  } catch (error) {
    console.error('Sync error:', error);
    if(syncText) syncText.textContent = '⚠ Gagal sinkronisasi otomatis';
    if(syncDot) syncDot.className = 'sync-dot offline';
  }
}

function loadFilesToUI(files) {
  files.forEach(file => {
    const type = file.type;
    const slotNum = file.slot;
    const fileId = file.fileId;
    const originalUrl = file.originalUrl;

    // Isi input field
    const input = document.getElementById(`input-${type}-${slotNum}`);
    if (input) input.value = originalUrl;

    // Tandai slot terisi
    const slot = document.getElementById(`slot-${type}-${slotNum}`);
    if (slot) slot.classList.add('filled');

    // Tampilkan card visual
    renderEmbeddedItem(type, slotNum, fileId, originalUrl);
  });
}

function renderEmbeddedItem(type, slotNum, fileId, url) {
  const container = document.getElementById(`embed-${type}`);
  if (!container) return;
  
  // Hapus empty state jika ada
  const emptyState = container.querySelector('.empty-state');
  if (emptyState) emptyState.remove();
  
  // Hapus card lama di slot ini jika ada
  const existing = container.querySelector(`[data-slot="${slotNum}"]`);
  if (existing) existing.remove();

  const item = document.createElement('div');
  item.className = 'embedded-item';
  item.dataset.slot = slotNum;
  item.dataset.fileId = fileId;

  let preview = type === 'mp4' 
    ? `<div class="preview-area" onclick="openViewer('${type}', ${slotNum})"><div class="play-overlay">▶</div><span class="preview-icon">🎬</span><span class="preview-text">Video MP4 Siap Diputar</span></div>`
    : `<div class="preview-area" onclick="openViewer('${type}', ${slotNum})"><span class="preview-icon">${typeIcons[type]}</span><span class="preview-text">${typeLabels[type]} File Tersimpan</span></div>`;

  item.innerHTML = `
    <div class="embedded-item-header">
      <span>${typeIcons[type]} ${typeLabels[type]} #${slotNum}</span>
      <div class="header-actions">
        <button class="btn-viewer" onclick="openViewer('${type}', ${slotNum})">👁 Buka Viewer</button>
        <button class="close-embed" onclick="clearFile('${type}', ${slotNum})">✕</button>
      </div>
    </div>
    ${preview}
  `;
  container.appendChild(item);
}

// ============================================================
// 3. FUNGSI SIMPAN FILE (Perbaiki format payload)
// ============================================================
async function embedFile(type, slotNum) {
  const input = document.getElementById(`input-${type}-${slotNum}`);
  const url = input.value.trim();
  if (!url) return showToast('Silakan tempelkan link Google Drive!', 'warning');

  const fileId = extractFileId(url);
  if (!fileId) return showToast('Link tidak valid!', 'error');

  const slot = document.getElementById(`slot-${type}-${slotNum}`);
  slot.classList.add('saving');

  // Format payload yang BENAR untuk backend
  const payload = {
    action: 'saveFile',
    pageId: PAGE_ID,
    pageTitle: PAGE_TITLE,
    deviceId: 'web_device',
    data: {
      type: type,
      slotNum: slotNum,
      fileId: fileId,
      originalUrl: url,
      fileType: typeLabels[type]
    }
  };

  try {
    const response = await fetch(BACKEND_URL, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const result = await response.json();

    slot.classList.remove('saving');
    if (result && result.success) {
      slot.classList.add('filled');
      renderEmbeddedItem(type, slotNum, fileId, url);
      showToast(`✓ File ${typeLabels[type]} #${slotNum} berhasil disimpan!`, 'success');
    } else {
      showToast(`⚠ Gagal simpan: ${result ? result.error : 'Unknown'}`, 'error');
    }
  } catch (error) {
    slot.classList.remove('saving');
    showToast('❌ Gagal koneksi ke server', 'error');
  }
}

async function clearFile(type, slotNum) {
  const input = document.getElementById(`input-${type}-${slotNum}`);
  const slot = document.getElementById(`slot-${type}-${slotNum}`);
  input.value = '';
  slot.classList.remove('filled');

  // Hapus dari backend
  await fetch(BACKEND_URL, {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action: 'deleteFile',
      pageId: PAGE_ID,
      data: { type: type, slotNum: slotNum }
    })
  });

  // Hapus dari UI
  const container = document.getElementById(`embed-${type}`);
  const item = container.querySelector(`[data-slot="${slotNum}"]`);
  if (item) item.remove();
  
  // Kembalikan empty state jika kosong
  if (container.querySelectorAll('.embedded-item').length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">${typeIcons[type]}</div><p><strong>Belum ada file ${typeLabels[type]}</strong></p></div>`;
  }
  showToast(`Slot ${typeLabels[type]} #${slotNum} direset.`, 'warning');
}

// ============================================================
// FUNGSI PEMBANTU
// ============================================================
function extractFileId(url) {
  if (!url) return null;
  let m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m) return m[1];
  if (/^[a-zA-Z0-9_-]{20,}$/.test(url)) return url;
  return null;
}

function openViewer(type, slotNum) {
  const input = document.getElementById(`input-${type}-${slotNum}`);
  const url = input ? input.value.trim() : '';
  const fileId = extractFileId(url);
  if (!fileId) return showToast('Tidak ada file!', 'warning');
  window.open(`${VIEWER_URLS[type]}?fileId=${fileId}`, '_blank');
}

function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span style="font-size:1.2rem;">${icons[type]}</span> ${message}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3500);
}

// ============================================================
// 🚀 INISIALISASI: Auto-Sync 1x saat halaman dibuka
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  const syncText = document.getElementById('syncText');
  const syncDot = document.getElementById('syncDot');
  
  if (navigator.onLine) {
    if(syncDot) syncDot.className = 'sync-dot online';
    if(syncText) syncText.textContent = '✓ Online — Melakukan sinkronisasi...';
    
    // JALANKAN AUTO-SYNC 1 KALI SAJA SAAT LOAD
    setTimeout(() => syncFromServer(), 1500);
  } else {
    if(syncDot) syncDot.className = 'sync-dot offline';
    if(syncText) syncText.textContent = '⚠ Offline — Mode lokal';
  }
});
</script>
</body>
</html>
</body>
</html>
