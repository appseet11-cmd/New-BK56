<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Literasi Digital & Riset Mandiri | Materi BK Kelas IX</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root { --primary: #1E40AF; --belajar: #10B981; --belajar-dark: #065F46; --pribadi: #6366F1; --dark: #1F2937; --gray: #6B7280; --light: #F9FAFB; --white: #FFFFFF; --shadow: 0 10px 30px rgba(0,0,0,0.08); --ppt: #D97706; --doc: #2563EB; --pdf: #DC2626; --mp4: #059669; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #F3F4F6 0%, #D1FAE5 100%); color: var(--dark); line-height: 1.7; min-height: 100vh; }
.hero { background: linear-gradient(135deg, var(--belajar) 0%, var(--primary) 50%, #7C3AED 100%); color: var(--white); padding: 70px 20px 100px; text-align: center; }
.hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 800; margin-bottom: 15px; }
.container { max-width: 1200px; margin: 0 auto; padding: 60px 20px; }
.overview, .file-section { background: var(--white); border-radius: 24px; padding: 40px; box-shadow: var(--shadow); margin-bottom: 30px; }
.file-tabs { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; background: var(--light); padding: 10px; border-radius: 14px; }
.file-tab { padding: 12px 22px; border-radius: 10px; cursor: pointer; font-weight: 600; background: var(--white); color: var(--gray); flex: 1; text-align: center; transition: all 0.3s; }
.file-tab.active[data-type="ppt"] { background: var(--ppt); color: var(--white); }
.file-tab.active[data-type="doc"] { background: var(--doc); color: var(--white); }
.file-tab.active[data-type="pdf"] { background: var(--pdf); color: var(--white); }
.file-tab.active[data-type="mp4"] { background: var(--mp4); color: var(--white); }
.file-panel { display: none; } .file-panel.show { display: block; }
.input-slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 25px; }
.input-slot { background: var(--light); padding: 18px; border-radius: 14px; border: 2px dashed #D1D5DB; position: relative; transition: all 0.3s; }
.input-slot.filled { border-style: solid; border-color: var(--belajar); background: #D1FAE5; }
.input-slot.saving { border-color: var(--ppt); }
.input-slot input { width: 100%; padding: 11px 14px; border: 1.5px solid #D1D5DB; border-radius: 10px; margin-bottom: 10px; font-family: 'Poppins'; }
.slot-actions { display: flex; gap: 8px; }
.btn-embed, .btn-clear, .btn-open-viewer { flex: 1; padding: 10px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; color: white; font-family: 'Poppins'; transition: all 0.3s; }
.btn-embed { background: var(--belajar); } .btn-embed:hover { background: var(--belajar-dark); }
.btn-clear { background: var(--pdf); } .btn-clear:hover { opacity: 0.8; }
.btn-open-viewer { background: var(--pribadi); } .btn-open-viewer:hover { opacity: 0.8; }
.embedded-files { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
.embedded-item { background: var(--white); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); border: 2px solid #D1FAE5; }
.embedded-item-header { padding: 12px 16px; background: #D1FAE5; display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: var(--belajar-dark); }
.toast { position: fixed; bottom: 30px; right: 30px; background: var(--dark); color: white; padding: 14px 22px; border-radius: 12px; z-index: 1000; transform: translateY(100px); opacity: 0; transition: all 0.4s; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: #059669; } .toast.error { background: #DC2626; } .toast.warning { background: #D97706; }
.sync-status-bar { display: flex; justify-content: space-between; align-items: center; background: #E0E7FF; padding: 12px 18px; border-radius: 12px; margin-bottom: 20px; }
.btn-sync { background: var(--pribadi); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Poppins'; }
.btn-sync:disabled { opacity: 0.6; }
</style>
</head>
<body>

<header class="hero">
  <h1>Literasi Digital & Riset Mandiri</h1>
  <p>Materi BK Kelas IX - SMPN 56 Jakarta</p>
</header>

<main class="container">
  <section class="overview">
    <h2>🔍 Tentang Topik Ini</h2>
    <p>Menguasai keterampilan mencari, mengevaluasi, dan mensintesis informasi dari berbagai sumber digital.</p>
  </section>

  <section class="file-section">
    <h2>📂 Materi & File Pendukung</h2>
    <div class="sync-status-bar">
      <span id="syncText">Memeriksa koneksi...</span>
      <button class="btn-sync" id="btnSync" onclick="syncFromServer()">🔄 Sync dari Server</button>
    </div>
    <div class="file-tabs">
      <div class="file-tab active" data-type="ppt" onclick="switchTab('ppt', this)">📊 PPT</div>
      <div class="file-tab" data-type="doc" onclick="switchTab('doc', this)">📄 Doc</div>
      <div class="file-tab" data-type="pdf" onclick="switchTab('pdf', this)">📕 PDF</div>
      <div class="file-tab" data-type="mp4" onclick="switchTab('mp4', this)">🎬 Video MP4</div>
    </div>
    <div class="file-panel show" id="panel-ppt"><div class="input-slots" id="inputs-ppt"></div><div class="embedded-files" id="embed-ppt"></div></div>
    <div class="file-panel" id="panel-doc"><div class="input-slots" id="inputs-doc"></div><div class="embedded-files" id="embed-doc"></div></div>
    <div class="file-panel" id="panel-pdf"><div class="input-slots" id="inputs-pdf"></div><div class="embedded-files" id="embed-pdf"></div></div>
    <div class="file-panel" id="panel-mp4"><div class="input-slots" id="inputs-mp4"></div><div class="embedded-files" id="embed-mp4"></div></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
// ============================================================
// 🔧 KONFIGURASI (SATU URL SAJA)
// ============================================================
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyqIp4C8weFTtOn22YnNP_o4Yq27ffHerJPfHud2FCZJ_Xwx-y35nXvPucSALiE3is7fQ/exec';
const VIEWER_BASE_URL = window.location.origin + window.location.pathname.replace(/[^/]*$/, '');
const VIEWER_URLS = {
  ppt: VIEWER_BASE_URL + 'viewer-ppt.html',
  doc: VIEWER_BASE_URL + 'viewer-doc.html',
  pdf: VIEWER_BASE_URL + 'viewer-pdf.html',
  mp4: VIEWER_BASE_URL + 'viewer-video.html'
};
const PAGE_ID = 'kelas9_topik5_literasi_digital';
const PAGE_TITLE = 'Literasi Digital & Riset Mandiri - Kelas IX';

function getDeviceId() {
  let deviceId = localStorage.getItem('deviceId');
  if (!deviceId) {
    deviceId = 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('deviceId', deviceId);
  }
  return deviceId;
}
const DEVICE_ID = getDeviceId();
let lastSyncTimestamp = localStorage.getItem('lastSyncTimestamp') || '0';

const types = ['ppt', 'doc', 'pdf', 'mp4'];
const typeLabels = { ppt: 'PPT', doc: 'DOC', pdf: 'PDF', mp4: 'MP4' };
const typePlaceholders = { ppt: 'PPT (PowerPoint)', doc: 'Doc (Word)', pdf: 'PDF', mp4: 'Video MP4' };
const typeIcons = { ppt: '📊', doc: '📄', pdf: '📕', mp4: '🎬' };

// ============================================================
// GENERATE INPUT SLOTS
// ============================================================
types.forEach(type => {
  const container = document.getElementById(`inputs-${type}`);
  if (!container) return;
  let html = '';
  for (let i = 1; i <= 4; i++) {
    html += `
<div class="input-slot" id="slot-${type}-${i}" data-type="${type}" data-slot="${i}">
  <div class="slot-label">
    <span>${typeIcons[type]} Slot ${i}</span>
    <span class="slot-badge">${typeLabels[type]}</span>
  </div>
  <input type="text" id="input-${type}-${i}" placeholder="Tempel link Google Drive ${typePlaceholders[type]} di sini..."
    onkeypress="if(event.key==='Enter') embedFile('${type}', ${i})">
  <div class="slot-actions">
    <button class="btn-embed" onclick="embedFile('${type}', ${i})">📥 Sematkan</button>
    <button class="btn-open-viewer" onclick="openViewer('${type}', ${i})" title="Buka di Viewer">👁 Viewer</button>
    <button class="btn-clear" onclick="clearFile('${type}', ${i})">🗑 Hapus</button>
  </div>
</div>
`;
  }
  container.innerHTML = html;
});

// ============================================================
// SWITCH TAB (FIXED - PASTI BERFUNGSI)
// ============================================================
function switchTab(type, element) {
  document.querySelectorAll('.file-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.file-panel').forEach(p => p.classList.remove('show'));
  element.classList.add('active');
  document.getElementById(`panel-${type}`).classList.add('show');
}

// ============================================================
// EXTRACT GOOGLE DRIVE FILE ID
// ============================================================
function extractFileId(url) {
  if (!url) return null;
  url = url.trim();
  let match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (match) return match[1];
  match = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (match) return match[1];
  match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (match) return match[1];
  if (/^[a-zA-Z0-9_-]{20,}$/.test(url)) return url;
  return null;
}

// ============================================================
// SHOW TOAST
// ============================================================
function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span style="font-size:1.2rem;">${icons[type]}</span> ${message}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3500);
}

// ============================================================
// BACKEND COMMUNICATION (SATU FUNGSI, SATU URL)
// ============================================================
async function callBackend(payload) {
  try {
    console.log('📤 Sending to backend:', payload.action, payload);
    const response = await fetch(BACKEND_URL, {
      method: 'POST',
      redirect: 'follow',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(payload)
    });
    const text = await response.text();
    console.log('✅ Backend response:', text);
    const data = JSON.parse(text);
    return data;
  } catch (error) {
    console.error('❌ Backend error:', error);
    return { success: false, error: error.message };
  }
}

async function saveFileToBackend(type, slotNum, fileId, originalUrl) {
  const slot = document.getElementById(`slot-${type}-${slotNum}`);
  slot.classList.add('saving');
  slot.classList.remove('saved');

  const payload = {
    action: 'saveFile',
    pageId: PAGE_ID,
    pageTitle: PAGE_TITLE,
    deviceId: DEVICE_ID,
    data: {
      type: type,
      slotNum: slotNum,
      fileId: fileId,
      originalUrl: originalUrl,
      fileType: typeLabels[type]
    }
  };

  const result = await callBackend(payload);

  slot.classList.remove('saving');
  if (result && result.success) {
    slot.classList.add('saved');
    setTimeout(() => slot.classList.remove('saved'), 3000);
    showToast('✓ File tersimpan di Spreadsheet!', 'success');
  } else {
    showToast('⚠ Gagal simpan: ' + (result ? result.error : 'Unknown'), 'error');
  }
  return result;
}

async function deleteFileFromBackend(type, slotNum) {
  const payload = {
    action: 'deleteFile',
    pageId: PAGE_ID,
    deviceId: DEVICE_ID,
    data: { type: type, slotNum: slotNum }
  };
  return await callBackend(payload);
}

// ============================================================
// SYNC FROM SERVER
// ============================================================
async function syncFromServer() {
  const syncDot = document.getElementById('syncDot');
  const syncText = document.getElementById('syncText');
  const btnSync = document.getElementById('btnSync');
  syncDot.className = 'sync-dot syncing';
  syncText.textContent = 'Menyinkronkan data...';
  btnSync.classList.add('loading');
  btnSync.disabled = true;

  try {
    const url = BACKEND_URL + '?action=getAllFiles&pageId=' + PAGE_ID;
    const response = await fetch(url, { method: 'GET' });
    const result = await response.json();
    if (result.success && result.files) {
      loadFilesToUI(result.files);
      syncDot.className = 'sync-dot online';
      syncText.textContent = '✓ Tersinkron — ' + result.files.length + ' file — ' + new Date().toLocaleTimeString('id-ID');
      lastSyncTimestamp = Date.now().toString();
      localStorage.setItem('lastSyncTimestamp', lastSyncTimestamp);
      showToast('✓ ' + result.files.length + ' file berhasil disinkronkan!', 'success');
    } else {
      throw new Error('Response tidak valid');
    }
  } catch (error) {
    syncDot.className = 'sync-dot offline';
    syncText.textContent = '⚠ Gagal sync';
    showToast('⚠ Gagal sinkronisasi: ' + error.message, 'error');
  } finally {
    btnSync.classList.remove('loading');
    btnSync.disabled = false;
  }
}

function loadFilesToUI(files) {
  files.forEach(file => {
    const type = file.type;
    const slotNum = file.slot;
    const fileId = file.fileId;
    const originalUrl = file.originalUrl;
    const input = document.getElementById(`input-${type}-${slotNum}`);
    if (input) input.value = originalUrl;
    const slot = document.getElementById(`slot-${type}-${slotNum}`);
    if (slot) slot.classList.add('filled');
    const container = document.getElementById(`embed-${type}`);
    if (!container) return;
    const existingItem = container.querySelector(`[data-slot="${slotNum}"]`);
    if (existingItem) existingItem.remove();
    const emptyState = container.querySelector('.empty-state');
    if (emptyState) emptyState.remove();
    const item = document.createElement('div');
    item.className = 'embedded-item';
    item.dataset.slot = slotNum;
    item.dataset.fileId = fileId;
    item.dataset.type = type;
    let previewContent = '';
    if (type === 'mp4') {
      previewContent = `
<div class="preview-area" onclick="openVideoPlayer('${fileId}')">
  <div class="play-overlay">▶</div>
  <span class="preview-icon">🎬</span>
  <span class="preview-text">Video MP4 Siap Diputar</span>
  <span class="preview-sub">Klik untuk membuka Video Player</span>
</div>
`;
    } else {
      previewContent = `
<div class="preview-area" onclick="openViewer('${type}', ${slotNum})">
  <span class="preview-icon">${typeIcons[type]}</span>
  <span class="preview-text">${typeLabels[type]} File Tersimpan</span>
  <span class="preview-sub">Klik untuk membuka di Viewer</span>
</div>
`;
    }
    item.innerHTML = `
<div class="embedded-item-header">
  <span>${typeIcons[type]} ${typeLabels[type]} #${slotNum}</span>
  <div class="header-actions">
    <button class="btn-viewer" onclick="openViewer('${type}', ${slotNum})" title="Buka di Viewer">👁 Buka Viewer</button>
    <button class="close-embed" onclick="removeEmbedded('${type}', ${slotNum})" title="Hapus">✕</button>
  </div>
</div>
${previewContent}
`;
    container.appendChild(item);
  });
}

function manualSync() { syncFromServer(); }

function checkDeviceChange() {
  const savedDeviceId = localStorage.getItem('lastActiveDeviceId');
  if (savedDeviceId && savedDeviceId !== DEVICE_ID) {
    console.log('🔄 Perangkat berubah, melakukan sync otomatis...');
    showToast('🔄 Perangkat terdeteksi berubah. Menyinkronkan data...', 'info');
    setTimeout(() => syncFromServer(), 1000);
  }
  localStorage.setItem('lastActiveDeviceId', DEVICE_ID);
}

// ============================================================
// EMBED FILE
// ============================================================
async function embedFile(type, slotNum) {
  const slot = document.getElementById(`slot-${type}-${slotNum}`);
  const input = document.getElementById(`input-${type}-${slotNum}`);
  const url = input.value.trim();
  if (!url) {
    showToast('Silakan tempelkan link Google Drive terlebih dahulu!', 'warning');
    input.focus();
    return;
  }
  const fileId = extractFileId(url);
  if (!fileId) {
    showToast('Link tidak valid! Pastikan link dari Google Drive.', 'error');
    return;
  }
  const saveResult = await saveFileToBackend(type, slotNum, fileId, url);
  const container = document.getElementById(`embed-${type}`);
  const existingItem = container.querySelector(`[data-slot="${slotNum}"]`);
  if (existingItem) existingItem.remove();
  const emptyState = container.querySelector('.empty-state');
  if (emptyState) emptyState.remove();
  const item = document.createElement('div');
  item.className = 'embedded-item';
  item.dataset.slot = slotNum;
  item.dataset.fileId = fileId;
  item.dataset.type = type;
  let previewContent = '';
  if (type === 'mp4') {
    previewContent = `
<div class="preview-area" onclick="openVideoPlayer('${fileId}')">
  <div class="play-overlay">▶</div>
  <span class="preview-icon">🎬</span>
  <span class="preview-text">Video MP4 Siap Diputar</span>
  <span class="preview-sub">Klik untuk membuka Video Player</span>
</div>
`;
  } else {
    previewContent = `
<div class="preview-area" onclick="openViewer('${type}', ${slotNum})">
  <span class="preview-icon">${typeIcons[type]}</span>
  <span class="preview-text">${typeLabels[type]} File Tersimpan</span>
  <span class="preview-sub">Klik untuk membuka di Viewer</span>
</div>
`;
  }
  item.innerHTML = `
<div class="embedded-item-header">
  <span>${typeIcons[type]} ${typeLabels[type]} #${slotNum}</span>
  <div class="header-actions">
    <button class="btn-viewer" onclick="openViewer('${type}', ${slotNum})" title="Buka di Viewer">👁 Buka Viewer</button>
    <button class="close-embed" onclick="removeEmbedded('${type}', ${slotNum})" title="Hapus">✕</button>
  </div>
</div>
${previewContent}
`;
  container.appendChild(item);
  slot.classList.add('filled');
  if (saveResult && saveResult.success) {
    showToast('✓ File ' + typeLabels[type] + ' #' + slotNum + ' berhasil disematkan & disimpan!', 'success');
  } else {
    showToast('⚠ File ditampilkan, tapi gagal disimpan ke server', 'warning');
  }
  setTimeout(() => { item.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 300);
}

// ============================================================
// OPEN VIEWER
// ============================================================
function openViewer(type, slotNum) {
  const input = document.getElementById(`input-${type}-${slotNum}`);
  const url = input ? input.value.trim() : '';
  const fileId = extractFileId(url);
  if (!fileId) {
    const container = document.getElementById(`embed-${type}`);
    const item = container.querySelector(`[data-slot="${slotNum}"]`);
    if (item && item.dataset.fileId) {
      openViewerWithFileId(type, item.dataset.fileId);
      return;
    }
    showToast('Tidak ada file yang bisa dibuka!', 'warning');
    return;
  }
  openViewerWithFileId(type, fileId);
}

function openViewerWithFileId(type, fileId) {
  let viewerUrl = '';
  const baseUrl = VIEWER_URLS[type] || VIEWER_URLS.pdf;
  switch(type) {
    case 'ppt': viewerUrl = baseUrl + '?fileId=' + fileId + '&title=PPT Viewer'; break;
    case 'doc': viewerUrl = baseUrl + '?fileId=' + fileId + '&title=DOC Viewer'; break;
    case 'pdf': viewerUrl = baseUrl + '?fileId=' + fileId + '&title=PDF Viewer'; break;
    case 'mp4': viewerUrl = baseUrl + '?fileId=' + fileId + '&title=Video Player'; break;
    default: viewerUrl = baseUrl + '?fileId=' + fileId;
  }
  window.open(viewerUrl, '_blank', 'noopener,noreferrer');
}

function openVideoPlayer(fileId) {
  const viewerUrl = VIEWER_URLS.mp4 + '?fileId=' + fileId + '&title=Video Player';
  window.open(viewerUrl, '_blank', 'noopener,noreferrer');
}

// ============================================================
// CLEAR FILE
// ============================================================
async function clearFile(type, slotNum) {
  const slot = document.getElementById(`slot-${type}-${slotNum}`);
  const input = document.getElementById(`input-${type}-${slotNum}`);
  input.value = '';
  slot.classList.remove('filled', 'saving', 'saved');
  await deleteFileFromBackend(type, slotNum);
  removeEmbedded(type, slotNum);
  showToast('Slot ' + typeLabels[type] + ' #' + slotNum + ' telah direset.', 'warning');
}

function removeEmbedded(type, slotNum) {
  const container = document.getElementById(`embed-${type}`);
  const item = container.querySelector(`[data-slot="${slotNum}"]`);
  if (item) {
    item.style.animation = 'fadeIn 0.3s ease reverse';
    setTimeout(() => item.remove(), 250);
  }
  const slot = document.getElementById(`slot-${type}-${slotNum}`);
  if (slot) slot.classList.remove('filled', 'saving', 'saved');
  setTimeout(() => {
    const container = document.getElementById(`embed-${type}`);
    if (container && container.querySelectorAll('.embedded-item').length === 0) {
      container.innerHTML = `
<div class="empty-state">
  <div class="icon">${typeIcons[type]}</div>
  <p><strong>Belum ada file ${typeLabels[type]} yang disematkan</strong></p>
  <p style="font-size:0.85rem; margin-top:5px;">Tempelkan link Google Drive di slot di atas, lalu klik "Sematkan"</p>
</div>
`;
    }
  }, 300);
}

// ============================================================
// BACK TO TOP
// ============================================================
window.addEventListener('scroll', function() {
  const backTop = document.getElementById('backTop');
  if (window.scrollY > 400) backTop.classList.add('show');
  else backTop.classList.remove('show');
});

// ============================================================
// INITIAL EMPTY STATE
// ============================================================
types.forEach(type => {
  const container = document.getElementById(`embed-${type}`);
  if (container && container.children.length === 0) {
    container.innerHTML = `
<div class="empty-state">
  <div class="icon">${typeIcons[type]}</div>
  <p><strong>Belum ada file ${typeLabels[type]} yang disematkan</strong></p>
  <p style="font-size:0.85rem; margin-top:5px;">Tempelkan link Google Drive di slot di atas, lalu klik "Sematkan"</p>
</div>
`;
  }
});

// ============================================================
// INTERACTIVE ELEMENTS
// ============================================================
document.querySelectorAll('.process-step, .search-item, .sift-item, .tool-item, .synthesis-step, .scenario-item').forEach(el => {
  el.addEventListener('click', function() {
    const name = this.querySelector('.step-name, .name, .letter')?.textContent || this.querySelector('strong')?.textContent || 'Item';
    showToast('🔍 ' + name + ' — Klik untuk refleksi', 'success');
  });
});

// ============================================================
// FLOATING HOME BUTTON
// ============================================================
const HOME_LINK_KEY = 'floatingHomeLink_pribadi9_topik5';
function loadHomeLink() {
  const btn = document.getElementById('floatingHomeBtn');
  const input = document.getElementById('homeLinkInput');
  const currentDisplay = document.getElementById('currentLinkDisplay');
  const currentText = document.getElementById('currentLinkText');
  const defaultText = document.getElementById('defaultLinkText');
  if (!btn) return;
  const defaultLink = btn.getAttribute('data-default-link') || '';
  if (defaultText) defaultText.textContent = defaultLink || '(belum diatur di HTML)';
  const overrideLink = localStorage.getItem(HOME_LINK_KEY);
  if (overrideLink) {
    btn.dataset.activeLink = overrideLink;
    if (input) input.value = overrideLink;
    if (currentDisplay && currentText) { currentText.textContent = overrideLink; currentDisplay.style.display = 'block'; }
  } else {
    btn.dataset.activeLink = defaultLink;
    if (input) input.value = defaultLink;
    if (currentDisplay) currentDisplay.style.display = 'none';
  }
}
function saveHomeLink() {
  const input = document.getElementById('homeLinkInput');
  const url = input.value.trim();
  const btn = document.getElementById('floatingHomeBtn');
  const defaultLink = btn.getAttribute('data-default-link') || '';
  if (!url) { showToast('Silakan masukkan URL terlebih dahulu!', 'warning'); return; }
  if (url === defaultLink) { resetHomeLink(); return; }
  if (!/^https?:\/\/.+/i.test(url) && !url.startsWith('/') && !url.startsWith('#')) {
    showToast('Format URL tidak valid. Gunakan http:// atau https://', 'error'); return;
  }
  localStorage.setItem(HOME_LINK_KEY, url);
  btn.dataset.activeLink = url;
  const currentDisplay = document.getElementById('currentLinkDisplay');
  const currentText = document.getElementById('currentLinkText');
  if (currentDisplay && currentText) { currentText.textContent = url; currentDisplay.style.display = 'block'; }
  showToast('Link override berhasil disimpan!', 'success');
  toggleHomePanel(null, true);
}
function resetHomeLink() {
  localStorage.removeItem(HOME_LINK_KEY);
  const btn = document.getElementById('floatingHomeBtn');
  const input = document.getElementById('homeLinkInput');
  const currentDisplay = document.getElementById('currentLinkDisplay');
  const defaultLink = btn.getAttribute('data-default-link') || '';
  if (input) input.value = defaultLink;
  if (btn) btn.dataset.activeLink = defaultLink;
  if (currentDisplay) currentDisplay.style.display = 'none';
  showToast('Link dikembalikan ke default.', 'success');
  toggleHomePanel(null, true);
}
function toggleHomePanel(event, forceClose = false) {
  if (event) { event.preventDefault(); event.stopPropagation(); }
  const panel = document.getElementById('floatingHomePanel');
  if (!panel) return;
  if (forceClose) { panel.classList.remove('show'); return; }
  panel.classList.toggle('show');
}
function navigateHome(event) {
  if (event && event.target.closest('.settings-btn')) return;
  if (event) event.preventDefault();
  const btn = document.getElementById('floatingHomeBtn');
  const activeLink = btn ? btn.dataset.activeLink : '';
  const defaultLink = btn ? btn.getAttribute('data-default-link') : '';
  const finalLink = activeLink || defaultLink;
  if (!finalLink) { showToast('Link belum diatur.', 'warning'); toggleHomePanel(null); return; }
  window.location.href = finalLink;
}
document.addEventListener('click', function(e) {
  const wrapper = document.getElementById('floatingHomeWrapper');
  const panel = document.getElementById('floatingHomePanel');
  if (wrapper && panel && panel.classList.contains('show')) {
    if (!wrapper.contains(e.target)) panel.classList.remove('show');
  }
});

// ============================================================
// INISIALISASI
// ============================================================
window.addEventListener('DOMContentLoaded', function() {
  loadHomeLink();
  checkDeviceChange();
  const syncDot = document.getElementById('syncDot');
  const syncText = document.getElementById('syncText');
  if (navigator.onLine) {
    syncDot.className = 'sync-dot online';
    syncText.textContent = '✓ Online — Klik "Sync" untuk memuat data';
    setTimeout(() => syncFromServer(), 2000);
  } else {
    syncDot.className = 'sync-dot offline';
    syncText.textContent = '⚠ Offline — Mode lokal aktif';
  }
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && navigator.onLine) { checkDeviceChange(); }
  });
});
window.addEventListener('online', function() {
  const syncDot = document.getElementById('syncDot');
  const syncText = document.getElementById('syncText');
  syncDot.className = 'sync-dot online';
  syncText.textContent = '✓ Online — Menyinkronkan...';
  showToast('✓ Koneksi kembali! Menyinkronkan data...', 'info');
  syncFromServer();
});
window.addEventListener('offline', function() {
  const syncDot = document.getElementById('syncDot');
  const syncText = document.getElementById('syncText');
  syncDot.className = 'sync-dot offline';
  syncText.textContent = '⚠ Offline — Mode lokal aktif';
  showToast('⚠ Koneksi terputus.', 'warning');
});
</script>
